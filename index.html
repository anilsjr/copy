<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta tags for character set and viewport settings -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Copy to Clipboard</title>
        
        <!-- Bootstrap CSS for styling -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <!-- Font Awesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        
        <!-- Custom CSS for additional styling -->
        <link rel="stylesheet" href="css/style.css">
    </head>
<body>

    <!-- Main container -->
    <div class="container">
        <!-- Header text -->
        <h2 class="text-center">Click the button to copy the text in the box</h2>
        
        <!-- Input field with default value -->
        <input id="data" value="hello there"></input>
        
        <!-- Copy button with Font Awesome icon -->
        <button class="btn btn-secondary mx-2" id="copy-Button" onclick="copyToClipboard()">
            <i class="fa-solid fa-copy"></i> Copy
        </button>
    </div>

    <!-- Footer section -->
    <footer class="text-center p-3 bg-dark text-white">
        <!-- GitHub link button -->
        <a href="https://github.com/anilsjr" class="btn btn-primary ml-2">
            <i class="fab fa-github"></i> GitHub
        </a>
        
        <!-- Portfolio link button -->
        <a href="https://anilsjr.github.io/portfolio/" class="btn btn-secondary ml-2">
            <i class="fas fa-briefcase"></i> Portfolio
        </a>
    </footer>
    
    <!-- JavaScript file for functionality -->
    <script src="js/script.js"></script>
</body>
</html>
